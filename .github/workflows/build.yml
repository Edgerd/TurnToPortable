name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        shell: pwsh
        run: cargo fmt --all --check

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Rust (pxe-cli + pxe-stub)
        shell: pwsh
        run: |
          cargo build --release -p pxe-cli -p pxe-stub
          Copy-Item target\release\pxe.exe app\
          Copy-Item target\release\pxe-stub.exe app\

      - name: Test Rust
        shell: pwsh
        run: cargo test --workspace

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Build Flutter Windows
        working-directory: app
        run: flutter build windows --release

      - name: Bundle
        shell: pwsh
        run: |
          $out = "app\build\windows\x64\runner\Release"
          Copy-Item app\pxe.exe $out\
          Copy-Item app\pxe-stub.exe $out\
          # 随包分发 7-Zip 组件（NSIS 等格式需要；LGPL 许可允许再分发）
          Copy-Item "C:\Program Files\7-Zip\7z.exe" $out\
          Copy-Item "C:\Program Files\7-Zip\7z.dll" $out\
          Copy-Item "C:\Program Files\7-Zip\license.txt" $out\7-zip-license.txt
          Compress-Archive -Path "$out\*" -DestinationPath PortableXE-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PortableXE-windows
          path: PortableXE-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PortableXE-windows.zip
