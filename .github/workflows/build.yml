name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # artifact / zip 文件名带版本：tag 构建时为 v* 版本号，分支构建为分支名
      ARTIFACT: PortableXE-${{ github.ref_name }}-windows.zip
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        shell: pwsh
        run: cargo fmt --all --check

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Rust (pxe-cli + pxe-stub)
        shell: pwsh
        run: |
          cargo build --release -p pxe-cli -p pxe-stub
          Copy-Item target\release\pxe.exe app\
          Copy-Item target\release\pxe-stub.exe app\

      - name: Test Rust
        shell: pwsh
        run: cargo test --workspace

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Build Flutter Windows
        working-directory: app
        run: flutter build windows --release

      - name: Bundle
        shell: pwsh
        run: |
          $out = "app\build\windows\x64\runner\Release"
          Copy-Item app\pxe.exe $out\
          Copy-Item app\pxe-stub.exe $out\
          # 随包分发 7-Zip 组件：用 myfreeer/7z-build-nsis 构建（NSIS 脚本支持更广；
          # LGPL + unRAR 许可允许再分发）。仅用系统 7z 解开压缩包，产物用新构建。
          $v = "26.04"
          Invoke-WebRequest -Uri "https://github.com/myfreeer/7z-build-nsis/releases/download/$v/7z$($v.Replace('.','')).7z" -OutFile "7zdist.7z"
          & "C:\Program Files\7-Zip\7z.exe" x -y -o"7zdist" "7zdist.7z" | Out-Null
          Copy-Item "7zdist\7z.exe" $out\
          Copy-Item "7zdist\7z.dll" $out\
          Copy-Item "7zdist\License.txt" $out\7-zip-license.txt
          Compress-Archive -Path "$out\*" -DestinationPath "$env:ARTIFACT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}
